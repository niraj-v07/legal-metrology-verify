<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Legal Metrology e-Verification Portal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --navy:#0b2e59;
    --navy-dark:#081f3d;
    --gold:#c99a2e;
    --border:#c7ccd1;
    --bg:#f2f3f5;
    --ok:#1c7a3c;
    --pending:#a15c00;
    --overdue:#a11212;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:#1a1a1a;
  }
  header.topbar{
    background:var(--navy);
    color:#fff;
    padding:6px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:4px solid var(--gold);
  }
  header.topbar .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  header.topbar .brand .emblem{
    height:56px;width:auto;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    overflow:hidden;
  }
  header.topbar .brand .emblem img{
    height:100%;width:auto;object-fit:contain;
  }
  header.topbar h1{
    font-size:16px;
    margin:0;
    font-weight:600;
    letter-spacing:.3px;
  }
  header.topbar .sub{
    font-size:11px;
    color:#cfd9e8;
  }
  nav.tabs{
    background:var(--navy-dark);
    display:flex;
    gap:2px;
    padding:0 24px;
  }
  nav.tabs button{
    background:transparent;
    border:none;
    color:#d7deea;
    padding:10px 16px;
    font-size:13px;
    cursor:pointer;
    border-bottom:3px solid transparent;
  }
  nav.tabs button.active{
    color:#fff;
    border-bottom-color:var(--gold);
    background:rgba(255,255,255,0.05);
  }
  main{
    max-width:1100px;
    margin:20px auto;
    padding:0 20px 60px;
  }
  .card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:3px;
    padding:20px 22px;
    margin-bottom:18px;
  }
  .card h2{
    font-size:16px;
    margin:0 0 14px;
    color:var(--navy);
    border-bottom:2px solid var(--border);
    padding-bottom:8px;
  }
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .role-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:10px;}
  .role-box{
    border:1px solid var(--border);
    background:#fafbfc;
    padding:18px 10px;
    text-align:center;
    cursor:pointer;
    border-radius:3px;
    font-size:13px;
    font-weight:600;
    color:var(--navy);
  }
  .role-box:hover{border-color:var(--navy);background:#eef3f9;}
  .role-box .icon{font-size:26px;display:block;margin-bottom:8px;}
  label{
    display:block;
    font-size:12px;
    font-weight:600;
    margin:10px 0 4px;
    color:#333;
  }
  input,select{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:3px;
    font-size:13px;
  }
  button.primary{
    background:var(--navy);
    color:#fff;
    border:none;
    padding:9px 18px;
    font-size:13px;
    border-radius:3px;
    cursor:pointer;
    margin-top:14px;
  }
  button.primary:hover{background:var(--navy-dark);}
  button.secondary{
    background:#fff;
    color:var(--navy);
    border:1px solid var(--navy);
    padding:7px 14px;
    font-size:12px;
    border-radius:3px;
    cursor:pointer;
  }
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{
    text-align:left;
    padding:9px 10px;
    border-bottom:1px solid var(--border);
  }
  th{
    background:#eef1f4;
    color:var(--navy);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.4px;
  }
  .status{
    padding:2px 8px;
    border-radius:10px;
    font-size:11px;
    font-weight:600;
    color:#fff;
  }
  .status.verified{background:var(--ok);}
  .status.pending{background:var(--pending);}
  .status.overdue{background:var(--overdue);}
  .status.assigned{background:#3a5f8a;}
  .hidden{display:none !important;}
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  .stat-box{
    background:#fff;
    border:1px solid var(--border);
    border-left:5px solid var(--navy);
    padding:14px 16px;
  }
  .stat-box .num{font-size:24px;font-weight:700;color:var(--navy);}
  .stat-box .label{font-size:12px;color:#555;}
  .cert-box{
    border:1px dashed var(--navy);
    padding:16px;
    display:flex;
    gap:20px;
    align-items:center;
    background:#f8fafc;
  }
  .cert-box .details{font-size:12px;line-height:1.6;}
  .topbar-actions{display:flex;gap:8px;}
  .topbar-actions button{
    background:transparent;
    border:1px solid rgba(255,255,255,0.5);
    color:#fff;
    padding:6px 12px;
    font-size:12px;
    border-radius:3px;
    cursor:pointer;
  }
  .track-result{
    margin-top:14px;
    padding:12px 14px;
    background:#f3f6fa;
    border-left:4px solid var(--navy);
    font-size:13px;
  }
  .small-note{font-size:11px;color:#666;margin-top:6px;}
  footer{
    text-align:center;
    font-size:11px;
    color:#777;
    padding:16px;
  }
</style>
</head>

    { id:"INS-1001", type:"Weighing Scale", owner:"Ramesh Traders", status:"verified", certId:"CERT-8841", expiry:"2027-03-10", assignedTo:"LMO-Kumar" },
    { id:"INS-1002", type:"Fuel Dispenser", owner:"Shakti Petrol Pump", status:"pending", certId:null, expiry:null, assignedTo:"LMO-Kumar" },
    { id:"INS-1003", type:"Water Meter", owner:"Green Apartments", status:"assigned", certId:null, expiry:null, assignedTo:"GATC-Chennai01" },
    { id:"INS-1004", type:"Weighbridge", owner:"Anand Logistics", status:"overdue", certId:"CERT-7710", expiry:"2026-08-01", assignedTo:"LMO-Kumar" }
  ]
};

/* ---------------------------------------------------------
   SIMPLE ROUTER
   One function decides what HTML to draw inside #app
   based on db.currentRole and the requested "page".
--------------------------------------------------------- */
let currentPage = "landing";

function go(page){
  currentPage = page;
  render();
}

function render(){
  renderTopbarActions();
  renderTabs();
  const app = document.getElementById("app");
  if(currentPage === "landing") app.innerHTML = landingPage();
  else if(currentPage === "login") app.innerHTML = loginPage();
  else if(currentPage === "owner") app.innerHTML = ownerDashboard();
  else if(currentPage === "lmo") app.innerHTML = officerDashboard("LMO");
  else if(currentPage === "gatc") app.innerHTML = officerDashboard("GATC");
  else if(currentPage === "admin") app.innerHTML = adminDashboard();
  attachHandlers();
}

function renderTopbarActions(){
  const el = document.getElementById("topbarActions");
  const homeBtn = `<button onclick="goHome()">Home</button>`;
  if(db.currentRole){
    el.innerHTML = `${homeBtn}<button onclick="logout()">Logout (${db.currentRole.toUpperCase()})</button>`;
  } else if(currentPage !== "landing"){
    el.innerHTML = `${homeBtn}<button onclick="go('login')">Login</button>`;
  } else {
    el.innerHTML = `<button onclick="go('login')">Login</button>`;
  }
}

/* Home always sends the visitor back to the public landing page,
   without needing to log in. Logging out is a separate action. */
function goHome(){
  go("landing");
}

function renderTabs(){
  const el = document.getElementById("tabBar");
  if(!db.currentRole){ el.innerHTML=""; return; }
  const tabs = {owner:"Owner Dashboard", lmo:"LMO Dashboard", gatc:"GATC Dashboard", admin:"Admin Dashboard"};
  const key = db.currentRole;
  el.innerHTML = `<button class="active">${tabs[key]}</button>`;
}

function logout(){
  db.currentRole = null;
  go("landing");
}

/* ---------------------------------------------------------
   PAGE 1: PUBLIC LANDING PAGE
--------------------------------------------------------- */
function landingPage(){
  return `
    <div class="card">
      <h2>About this Portal</h2>
      <p style="font-size:13px;line-height:1.7;">
        Under the Legal Metrology Act, 2009, every weighing and measuring instrument used in trade
        must be periodically verified and stamped. This portal digitizes that entire process —
        online applications, digital inspection recording, and QR-authenticated certificates —
        connecting Instrument Owners, Legal Metrology Officers (LMOs), Government Approved Test
        Centres (GATCs), and Regulators on one platform.
      </p>
    </div>

    <div class="grid-2">
      <div class="card">
        <h2>Track an Application</h2>
        <label>Enter Certificate / Application ID</label>
        <input type="text" id="trackInput" placeholder="e.g. CERT-8841 or INS-1002">
        <button class="primary" onclick="trackStatus()">Check Status</button>
        <div id="trackResult"></div>
      </div>

      <div class="card">
        <h2>Stakeholder Login</h2>
        <p style="font-size:13px;">Instrument Owners, LMOs, GATCs and Admins can log in to access
        their role-specific dashboard.</p>
        <button class="primary" onclick="go('login')">Proceed to Login</button>
      </div>
    </div>
  `;
}

function trackStatus(){
  const val = document.getElementById("trackInput").value.trim().toUpperCase();
  const found = db.instruments.find(i => i.id === val || i.certId === val);
  const box = document.getElementById("trackResult");
  if(!found){
    box.innerHTML = `<div class="track-result">No record found for "${val}". Try INS-1001 or CERT-8841.</div>`;
    return;
  }
  box.innerHTML = `
    <div class="track-result">
      <b>${found.id}</b> — ${found.type} (${found.owner})<br>
      Status: <span class="status ${found.status}">${found.status.toUpperCase()}</span><br>
      ${found.certId ? "Certificate: "+found.certId+" — Valid till "+found.expiry : "Certificate not yet issued."}
    </div>`;
}

/* ---------------------------------------------------------
   PAGE 2: LOGIN / ROLE SELECTION
--------------------------------------------------------- */
function loginPage(){
  return `
    <div class="card">
      <h2>Select Your Role</h2>
      <div class="role-grid">
        <div class="role-box" onclick="selectRole('owner')"><span class="icon">&#128100;</span>Instrument Owner</div>
        <div class="role-box" onclick="selectRole('lmo')"><span class="icon">&#128737;</span>LMO</div>
        <div class="role-box" onclick="selectRole('gatc')"><span class="icon">&#127970;</span>GATC</div>
        <div class="role-box" onclick="selectRole('admin')"><span class="icon">&#9881;</span>Admin</div>
      </div>
      <div id="credentialsBox"></div>
    </div>
  `;
}

function selectRole(role){
  document.getElementById("credentialsBox").innerHTML = `
    <div style="margin-top:18px;border-top:1px solid var(--border);padding-top:14px;">
      <label>Username</label>
      <input type="text" value="${role}_user" id="uname">
      <label>Password</label>
      <input type="password" value="demo123" id="pword">
      <button class="primary" onclick="doLogin('${role}')">Login as ${role.toUpperCase()}</button>
      <div class="small-note">Prototype note: any credentials work — real system would verify against the database.</div>
    </div>`;
}

function doLogin(role){
  db.currentRole = role;
  go(role);
}

/* ---------------------------------------------------------
   PAGE 3: OWNER DASHBOARD
--------------------------------------------------------- */
function ownerDashboard(){
  const mine = db.instruments.filter(i => i.owner === "Ramesh Traders" || i.owner === "Anand Logistics");
  return `
    <div class="card">
      <h2>My Instruments</h2>
      <label>Search by Instrument ID or Type</label>
      <input type="text" id="ownerSearch" placeholder="e.g. INS-1001 or Weighbridge" oninput="filterOwnerTable()">
      <table id="ownerTable" style="margin-top:12px;">
        <tr><th>Instrument ID</th><th>Type</th><th>Status</th><th>Certificate</th></tr>
        ${mine.map(i => `
          <tr>
            <td>${i.id}</td>
            <td>${i.type}</td>
            <td><span class="status ${i.status}">${i.status.toUpperCase()}</span></td>
            <td>${i.certId ? `<button class="secondary" onclick="viewCert('${i.certId}')">View QR</button>` : "—"}</td>
          </tr>`).join("")}
      </table>
    </div>

    <div class="card">
      <h2>Apply for New Verification</h2>
      <label>Instrument Type</label>
      <select id="newType">
        <option>Weighing Scale</option>
        <option>Fuel Dispenser</option>
        <option>Water Meter</option>
        <option>Weighbridge</option>
      </select>
      <label>Upload Supporting Document</label>
      <input type="file">
      <button class="primary" onclick="submitApplication()">Submit Application</button>
    </div>

    <div class="card" id="certViewer"></div>
  `;
}

function filterOwnerTable(){
  const q = document.getElementById("ownerSearch").value.toLowerCase();
  const rows = document.querySelectorAll("#ownerTable tr");
  rows.forEach((row, idx) => {
    if(idx === 0) return;
    row.style.display = row.textContent.toLowerCase().includes(q) ? "" : "none";
  });
}

function submitApplication(){
  const type = document.getElementById("newType").value;
  const newId = "INS-" + (1000 + db.instruments.length + 1);
  db.instruments.push({id:newId, type:type, owner:"Ramesh Traders", status:"pending", certId:null, expiry:null, assignedTo:"Unassigned"});
  alert("Application submitted! Reference ID: " + newId);
  go("owner");
}

function viewCert(certId){
  const inst = db.instruments.find(i => i.certId === certId);
  const box = document.getElementById("certViewer");
  box.innerHTML = `
    <h2>Digital Certificate — ${certId}</h2>
    <div class="cert-box" id="printableCert">
      <div id="qrcode"></div>
      <div class="details">
        <b>Instrument:</b> ${inst.type}<br>
        <b>Owner:</b> ${inst.owner}<br>
        <b>Valid Till:</b> ${inst.expiry}<br>
        <span class="small-note">Scan this QR to verify authenticity publicly.</span>
      </div>
    </div>
    <button class="secondary" style="margin-top:12px;" onclick="window.print()">Print / Export Certificate</button>`;
  new QRCode(document.getElementById("qrcode"), {
    text: "VERIFY:" + certId,
    width: 110, height: 110
  });
}

/* ---------------------------------------------------------
   PAGE 4: LMO / GATC DASHBOARD (shared layout, different label)
--------------------------------------------------------- */
function officerDashboard(labelPrefix){
  const assigned = db.instruments.filter(i =>
    i.status === "pending" || i.status === "assigned" || i.status === "overdue"
  );
  return `
    <div class="card">
      <h2>Assigned Verification Tasks</h2>
      <table>
        <tr><th>Instrument ID</th><th>Type</th><th>Owner</th><th>Status</th><th>Action</th></tr>
        ${assigned.map(i => `
          <tr>
            <td>${i.id}</td><td>${i.type}</td><td>${i.owner}</td>
            <td><span class="status ${i.status}">${i.status.toUpperCase()}</span></td>
            <td><button class="secondary" onclick="openInspection('${i.id}')">Inspect</button></td>
          </tr>`).join("")}
      </table>
    </div>
    <div class="card" id="inspectionForm"></div>
  `;
}

function openInspection(id){
  const inst = db.instruments.find(i => i.id === id);
  document.getElementById("inspectionForm").innerHTML = `
    <h2>Record Inspection — ${id}</h2>
    <label>Observation</label>
    <select id="obs"><option>Pass — within tolerance</option><option>Fail — out of tolerance</option></select>
    <label>Remarks</label>
    <input type="text" placeholder="e.g. calibrated against standard weight set">
    <button class="primary" onclick="completeInspection('${id}')">Submit &amp; Generate Certificate</button>
  `;
}

function completeInspection(id){
  const inst = db.instruments.find(i => i.id === id);
  inst.status = "verified";
  inst.certId = "CERT-" + Math.floor(1000+Math.random()*9000);
  inst.expiry = "2027-09-05";
  alert("Inspection recorded. Certificate " + inst.certId + " generated for " + id);
  go(db.currentRole);
}

/* ---------------------------------------------------------
   PAGE 5: ADMIN DASHBOARD
--------------------------------------------------------- */
function adminDashboard(){
  const total = db.instruments.length;
  const verified = db.instruments.filter(i=>i.status==="verified").length;
  const pending = db.instruments.filter(i=>i.status==="pending"||i.status==="assigned").length;
  const overdue = db.instruments.filter(i=>i.status==="overdue").length;

  return `
    <div class="stat-row">
      <div class="stat-box"><div class="num">${total}</div><div class="label">Total Instruments</div></div>
      <div class="stat-box"><div class="num">${verified}</div><div class="label">Verified</div></div>
      <div class="stat-box"><div class="num">${pending}</div><div class="label">Pending / Assigned</div></div>
      <div class="stat-box"><div class="num">${overdue}</div><div class="label">Overdue</div></div>
    </div>

    <div class="card">
      <h2>Search &amp; Retrieve Records</h2>
      <label>Search by Instrument ID, Owner, or Type</label>
      <input type="text" id="adminSearch" placeholder="e.g. Ramesh, Weighbridge, INS-1004" oninput="filterAdminTable()">
    </div>

    <div class="card">
      <h2>All Applications — System Wide</h2>
      <table id="adminTable">
        <tr><th>ID</th><th>Type</th><th>Owner</th><th>Assigned To</th><th>Status</th></tr>
        ${db.instruments.map(i => `
          <tr>
            <td>${i.id}</td><td>${i.type}</td><td>${i.owner}</td>
            <td>${i.assignedTo}</td>
            <td><span class="status ${i.status}">${i.status.toUpperCase()}</span></td>
          </tr>`).join("")}
      </table>
      <button class="secondary" style="margin-top:12px;" onclick="exportReport()">Export Report (CSV)</button>
    </div>
  `;
}

function filterAdminTable(){
  const q = document.getElementById("adminSearch").value.toLowerCase();
  const rows = document.querySelectorAll("#adminTable tr");
  rows.forEach((row, idx) => {
    if(idx === 0) return; // skip header row
    const text = row.textContent.toLowerCase();
    row.style.display = text.includes(q) ? "" : "none";
  });
}

/* Builds a plain CSV string from the instruments array and
   triggers a real file download using a Blob — this is what
   a "generate report" button typically does client-side. */
function exportReport(){
  let csv = "Instrument ID,Type,Owner,Assigned To,Status\n";
  db.instruments.forEach(i => {
    csv += `${i.id},${i.type},${i.owner},${i.assignedTo},${i.status}\n`;
  });
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "verification_report.csv";
  a.click();
  URL.revokeObjectURL(url);
}

/* ---------------------------------------------------------
   MISC: nothing else needed after render, but placeholder
   for future event delegation if the app grows.
--------------------------------------------------------- */
function attachHandlers(){ /* inline onclick handlers used for simplicity in this prototype */ }

render();
</script>
